name: CI

on:
  push:
    branches: [claude/sprint-coverage-calculator-O3GRf]
  pull_request:
    branches: [claude/sprint-coverage-calculator-O3GRf]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q calculator.py sprint_app.py sprint_cli.py
      - run: python -c "import calculator"
